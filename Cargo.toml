[package]
name = "dyland"
version = "0.3.0"
edition = "2021"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
winapi = { version = "0.3.9", features = [
    "winuser", "wingdi", "windef", "minwindef", "minwinbase", "libloaderapi",
    "combaseapi", "objbase", "mmdeviceapi", "endpointvolume",
    "wtypesbase", "guiddef", "winnt", "winerror", "winbase",
    "sysinfoapi", "processthreadsapi", "winreg", "iphlpapi", "ifmib",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
