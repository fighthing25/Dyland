[package]
name = "dyland"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
winapi = { version = "0.3.9", features = [
    "winuser", "wingdi", "windef", "minwindef", "libloaderapi",
    "combaseapi", "objbase", "mmdeviceapi", "endpointvolume",
    "wtypesbase", "guiddef", "winnt", "winerror",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
